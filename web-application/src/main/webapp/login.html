<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCASP | Sign In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .brand {
            color: #2563eb;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">SCASP</div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Sign in to access your campus services.
        </p>

        <form method="POST" action="j_security_check">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="j_username"
                placeholder="Enter your username"
                autocomplete="username"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="j_password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

            <button type="submit">Sign In</button>

        </form>

        <div class="footer">
            Smart Campus Academic Services Platform
        </div>
    </main>
</body>
</html>
